<svg xmlns="http://www.w3.org/2000/svg" width="760" height="920" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" viewBox="0 0 760 920" role="img" aria-label="One new data week wakes the whole chain, and the LLM writes last" font-size="13"><rect width="760" height="920" fill="#ffffff"/><defs><marker id="run-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8f8c83"/></marker></defs><text x="24" y="28" font-size="15" font-weight="600" fill="#1d1c1a">One new data week wakes the whole chain, and the LLM writes last</text><text x="24" y="52" font-size="11.5" font-weight="600" fill="#5f5d57">TRIGGER</text><text x="256" y="52" font-size="11.5" font-weight="600" fill="#5f5d57">SP_RUN_WEEK STEPS</text><text x="536" y="52" font-size="11.5" font-weight="600" fill="#5f5d57">WRITES</text><g fill="none" stroke="#8f8c83" stroke-width="1.25"><path d="M124 120V148" marker-end="url(#run-arrow)"/><path d="M124 204V232" marker-end="url(#run-arrow)"/><path d="M124 288V316" marker-end="url(#run-arrow)"/><path d="M224 344H240V92H256" marker-end="url(#run-arrow)"/><path d="M380 120V140" marker-end="url(#run-arrow)"/><path d="M380 196V216" marker-end="url(#run-arrow)"/><path d="M380 272V292" marker-end="url(#run-arrow)"/><path d="M380 348V368" marker-end="url(#run-arrow)"/><path d="M380 424V444" marker-end="url(#run-arrow)"/><path d="M380 500V520" marker-end="url(#run-arrow)"/><path d="M380 576V596" marker-end="url(#run-arrow)"/><path d="M380 652V672" marker-end="url(#run-arrow)"/><path d="M380 728V748" marker-end="url(#run-arrow)"/><path d="M380 804V840" marker-end="url(#run-arrow)"/><path d="M256 868H224" marker-end="url(#run-arrow)"/><path d="M504 868H536" marker-end="url(#run-arrow)"/></g><g stroke="#d9d6ce" stroke-width="1" stroke-dasharray="3 3"><line x1="504" x2="528" y1="92" y2="92"/><line x1="504" x2="528" y1="168" y2="168"/><line x1="504" x2="528" y1="244" y2="244"/><line x1="504" x2="528" y1="320" y2="320"/><line x1="504" x2="528" y1="396" y2="396"/><line x1="504" x2="528" y1="472" y2="472"/><line x1="504" x2="528" y1="548" y2="548"/><line x1="504" x2="528" y1="624" y2="624"/><line x1="504" x2="528" y1="700" y2="700"/><line x1="504" x2="528" y1="776" y2="776"/></g><g><rect x="24" y="64" width="200" height="56" rx="8" fill="none" stroke="#8f8c83" stroke-width="1.25"/><text x="36" y="88" font-weight="600" fill="#1d1c1a">New week lands</text><text x="36" y="104" font-size="11.5" fill="#5f5d57">or Replay next week</text></g><g><rect x="24" y="148" width="200" height="56" rx="8" fill="none" stroke="#8f8c83" stroke-width="1.25"/><text x="36" y="172" font-weight="600" fill="#1d1c1a">Dynamic tables refresh</text><text x="36" y="188" font-size="11.5" fill="#5f5d57">adapter → grid → compare</text></g><g><rect x="24" y="232" width="200" height="56" rx="8" fill="none" stroke="#8f8c83" stroke-width="1.25"/><text x="36" y="256" font-weight="600" fill="#1d1c1a">Stream has data</text><text x="36" y="272" font-size="11.5" fill="#5f5d57">on DT_SHARE_COMPARE</text></g><g><rect x="24" y="316" width="200" height="56" rx="8" fill="none" stroke="#8f8c83" stroke-width="1.25"/><text x="36" y="340" font-weight="600" fill="#1d1c1a">Triggered task</text><text x="36" y="356" font-size="11.5" fill="#5f5d57">CALL SP_RUN_WEEK</text></g><g><rect x="256" y="64" width="248" height="56" rx="8" fill="none" fill-opacity="1" stroke="#8f8c83" stroke-width="1.25"/><text x="268" y="88" font-weight="600" fill="#1d1c1a">Open run</text><text x="268" y="104" font-size="11.5" fill="#5f5d57">run_id, idempotency, query tag</text></g><g><rect x="256" y="140" width="248" height="56" rx="8" fill="none" fill-opacity="1" stroke="#8f8c83" stroke-width="1.25"/><text x="268" y="164" font-weight="600" fill="#1d1c1a">Snapshot and restatements</text><text x="268" y="180" font-size="11.5" fill="#5f5d57">HASH_AGG per week × market</text></g><g><rect x="256" y="216" width="248" height="56" rx="8" fill="none" fill-opacity="1" stroke="#8f8c83" stroke-width="1.25"/><text x="268" y="240" font-weight="600" fill="#1d1c1a">Detect shifts</text><text x="268" y="256" font-size="11.5" fill="#5f5d57">gates + ANOMALY_DETECTION</text></g><g><rect x="256" y="292" width="248" height="56" rx="8" fill="none" fill-opacity="1" stroke="#8f8c83" stroke-width="1.25"/><text x="268" y="316" font-weight="600" fill="#1d1c1a">Share bridge</text><text x="268" y="332" font-size="11.5" fill="#5f5d57">exact LMDI, modes A to D</text></g><g><rect x="256" y="368" width="248" height="56" rx="8" fill="#2563c9" fill-opacity="0.12" stroke="#2563c9" stroke-width="2"/><text x="268" y="392" font-weight="600" fill="#1d1c1a">Artefact gate</text><text x="268" y="408" font-size="11.5" fill="#1d1c1a">rules R1 to R6, evidence kept</text></g><g><rect x="256" y="444" width="248" height="56" rx="8" fill="none" fill-opacity="1" stroke="#8f8c83" stroke-width="1.25"/><text x="268" y="468" font-weight="600" fill="#1d1c1a">Rank and suppress</text><text x="268" y="484" font-size="11.5" fill="#5f5d57">value at stake × confidence</text></g><g><rect x="256" y="520" width="248" height="56" rx="8" fill="none" fill-opacity="1" stroke="#8f8c83" stroke-width="1.25"/><text x="268" y="544" font-weight="600" fill="#1d1c1a">Where and who took it</text><text x="268" y="560" font-size="11.5" fill="#5f5d57">retailer split + TOP_INSIGHTS</text></g><g><rect x="256" y="596" width="248" height="56" rx="8" fill="none" fill-opacity="1" stroke="#8f8c83" stroke-width="1.25"/><text x="268" y="620" font-weight="600" fill="#1d1c1a">Early warning</text><text x="268" y="636" font-size="11.5" fill="#5f5d57">lever drops not yet in L4W share</text></g><g><rect x="256" y="672" width="248" height="56" rx="8" fill="none" fill-opacity="1" stroke="#8f8c83" stroke-width="1.25"/><text x="268" y="696" font-weight="600" fill="#1d1c1a">Fact pack</text><text x="268" y="712" font-size="11.5" fill="#5f5d57">every number gets an ID and source</text></g><g><rect x="256" y="748" width="248" height="56" rx="8" fill="none" fill-opacity="1" stroke="#8f8c83" stroke-width="1.25"/><text x="268" y="772" font-weight="600" fill="#1d1c1a">Write brief</text><text x="268" y="788" font-size="11.5" fill="#5f5d57">AI_COMPLETE JSON, then validator</text></g><g><text x="536" y="96" font-size="11.5" fill="#5f5d57">OPS.RUN_LOG</text><text x="536" y="172" font-size="11.5" fill="#5f5d57">OPS.FACT_SNAPSHOT</text><text x="536" y="248" font-size="11.5" fill="#5f5d57">APP.SHIFT_CANDIDATE</text><text x="536" y="324" font-size="11.5" fill="#5f5d57">APP.SHARE_BRIDGE</text><text x="536" y="394" font-size="11.5" fill="#1d1c1a">APP.ARTEFACT_CHECK</text><text x="536" y="410" font-size="11.5" fill="#5f5d57">data effects held back</text><text x="536" y="476" font-size="11.5" fill="#5f5d57">APP.SHIFT_RANKED</text><text x="536" y="546" font-size="11.5" fill="#5f5d57">APP.SHIFT_WHERE</text><text x="536" y="562" font-size="11.5" fill="#5f5d57">APP.SHARE_FLOW</text><text x="536" y="628" font-size="11.5" fill="#5f5d57">APP.EARLY_WARNING</text><text x="536" y="704" font-size="11.5" fill="#5f5d57">APP.FACT_PACK</text><text x="536" y="774" font-size="11.5" fill="#5f5d57">APP.BRIEF</text><text x="536" y="790" font-size="11.5" fill="#5f5d57">template if checks fail twice</text></g><g><rect x="24" y="840" width="200" height="56" rx="8" fill="none" stroke="#8f8c83" stroke-width="1.25"/><text x="36" y="864" font-weight="600" fill="#1d1c1a">Streamlit + CoWork</text><text x="36" y="880" font-size="11.5" fill="#5f5d57">review, drill, ask why</text></g><g><rect x="256" y="840" width="248" height="56" rx="8" fill="none" fill-opacity="1" stroke="#8f8c83" stroke-width="1.25"/><text x="268" y="864" font-weight="600" fill="#1d1c1a">Brief published</text><text x="268" y="880" font-size="11.5" fill="#5f5d57">status PUBLISHED, one per scope</text></g><g><rect x="536" y="840" width="200" height="56" rx="8" fill="none" stroke="#8f8c83" stroke-width="1.25"/><text x="548" y="864" font-weight="600" fill="#1d1c1a">Alert on new data</text><text x="548" y="880" font-size="11.5" fill="#5f5d57">email + Teams webhook</text></g></svg>
